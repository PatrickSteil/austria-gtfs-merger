name: Merge

on:
  # every six hours, but we cache, so all good
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-merge even if no new data'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build
        run: make

      # OpenStreetMap accessibility features for the wheelchair step. The
      # extract is rebuilt at most once per week (cache key = Monday of the
      # Geofabrik file's week) and never blocks the merge: on any failure the
      # step uses an older cache or is skipped, with a warning.
      - name: Resolve OSM extract week
        id: osm
        continue-on-error: true
        timeout-minutes: 2
        run: |
          LM=$(curl -sIL --fail --max-time 60 https://download.geofabrik.de/europe/austria-latest.osm.pbf | grep -i '^last-modified:' | tail -1 | cut -d' ' -f2- | tr -d '\r')
          [ -n "$LM" ] || { echo "no Last-Modified header from Geofabrik"; exit 1; }
          MONDAY=$(date -u -d "$LM -$(( $(date -u -d "$LM" +%u) - 1 )) days" +%Y%m%d)
          echo "week=$MONDAY" >> "$GITHUB_OUTPUT"

      - name: Restore OSM features cache
        id: osmcache
        uses: actions/cache/restore@v4
        with:
          path: |
            osm-features.json.gz
            osm-routes.json.gz
          key: osm-features-v2-${{ steps.osm.outputs.week }}
          restore-keys: osm-features-v2-

      - name: Extract OSM features
        id: osmextract
        if: steps.osmcache.outputs.cache-hit != 'true' && steps.osm.outputs.week != ''
        continue-on-error: true
        timeout-minutes: 20
        run: |
          curl -sSL --fail --max-time 1000 -o austria-latest.osm.pbf https://download.geofabrik.de/europe/austria-latest.osm.pbf
          CGO_ENABLED=0 go run ./cmd/osm-extract --pbf austria-latest.osm.pbf \
            --out osm-features.new.gz --routes-out osm-routes.new.gz
          mv osm-features.new.gz osm-features.json.gz
          mv osm-routes.new.gz osm-routes.json.gz
          rm -f austria-latest.osm.pbf

      # Only a freshly extracted file is saved, so a stale file restored via
      # restore-keys can never be stored under a newer key.
      - name: Save OSM features cache
        if: steps.osmextract.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            osm-features.json.gz
            osm-routes.json.gz
          key: osm-features-v2-${{ steps.osm.outputs.week }}

      - name: Check OSM features age
        continue-on-error: true
        run: |
          if [ ! -s osm-features.json.gz ]; then
            echo "::warning::No OSM features available; the OSM variant and its extras will be missing from this run."
          elif [ "${{ steps.osmextract.outcome }}" = "failure" ]; then
            echo "::warning::OSM extraction failed; using cached features from ${{ steps.osmcache.outputs.cache-matched-key }}."
          fi
          KEY="${{ steps.osmcache.outputs.cache-matched-key }}"
          if [ -n "$KEY" ] && [ "${{ steps.osmextract.outcome }}" != "success" ]; then
            AGE=$(( ( $(date -u +%s) - $(date -u -d "${KEY#osm-features-v2-}" +%s) ) / 86400 ))
            if [ "$AGE" -gt 60 ]; then
              echo "::warning::OSM features cache is $AGE days old."
            fi
          fi

      # Run the merger. A non-zero exit (failed download or parse error) fails
      # the job, so nothing is committed or released. On success we detect
      # whether new data was merged by checking whether versions.json changed.
      - name: Run GTFS merger
        id: merge
        env:
          DBP_USERNAME: ${{ secrets.GTFS_USERNAME }}
          DBP_PASSWORD: ${{ secrets.GTFS_PASSWORD }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          # austria.merged.zip never contains OpenStreetMap data. Everything
          # derived from OSM (ODbL) goes into austria.merged.osm.zip and into
          # osm-extras/ (stop attribute sidecar and QA report).
          ENRICH="steig,routes"
          OSM_ARGS=""
          if [ -s osm-features.json.gz ]; then
            ENRICH="all"
            OSM_ARGS="--osm-features osm-features.json.gz --osm-output austria.merged.osm.zip --osm-sidecar-dir osm-extras"
            if [ -s osm-routes.json.gz ]; then
              OSM_ARGS="$OSM_ARGS --osm-routes osm-routes.json.gz"
            fi
          fi
          ./merger -d -e -v --drop-shapes \
            --enrich "$ENRICH" --extended-route-types \
            --enrich-report enrich-report.json \
            --manifest versions.json \
            --output austria.merged.zip \
            $OSM_ARGS $FORCE_FLAG

      # Check whether the manifest changed (= at least one feed was updated).
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet versions.json 2>/dev/null || [ ! -f versions.json ]; then
            # Also treat a forced run as "changed" so the release still happens.
            if [ "${{ github.event.inputs.force }}" = "true" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "No GTFS versions changed – skipping release."
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Commit the updated versions.json back so the next run has a baseline.
      - name: Commit updated manifest
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json merge-stats.json
          git diff --cached --quiet || git commit -m "chore: update GTFS version manifest [skip ci]"
          git push

      # Clean the merged feed with gtfstidy (fork), used as a CLI: removes
      # non-essential data, drops erroneous entries / unreferenced entities and
      # minimizes services, which also makes the zip considerably smaller.
      # The fork's go.mod still declares the upstream module path, so
      # `go install` does not work; clone and build instead.
      - name: Tidy merged GTFS with gtfstidy
        if: steps.changes.outputs.changed == 'true'
        run: |
          git clone --depth 1 https://github.com/PatrickSteil/gtfstidy.git "$RUNNER_TEMP/gtfstidy"
          (cd "$RUNNER_TEMP/gtfstidy" && go build -o "$GITHUB_WORKSPACE/gtfstidy" .)
          tidy_one() {
            in="$1"
            out="${in%.zip}.tidy.zip"
            ./gtfstidy \
              --fix \
              --drop-non-essential \
              --drop-errs \
              --delete-orphans \
              --keep-ids \
              --fix-trip-headsigns \
              --fix-far-away-parents \
              --drop-too-fast-trips \
              --drop-single-stop-trips \
              --minimize-services \
              -o "$out" \
              "$in"
            # --drop-non-essential removes feed_info.txt (the release notes rely
            # on its feed_version for cheap version checks) and attributions.txt
            # (required by the OSM licence): put both back. Measured with
            # scripts/check-tidy-fields.sh: platform_code, wheelchair_boarding,
            # route_desc, route colors and extended route types survive tidy.
            dir="$(mktemp -d)"
            unzip -p "$in" feed_info.txt > "$dir/feed_info.txt"
            if unzip -Z1 "$in" | grep -qx attributions.txt; then
              unzip -p "$in" attributions.txt > "$dir/attributions.txt"
            fi
            zip -j "$out" "$dir"/*.txt
            mv "$out" "$in"
            ls -lh "$in"
          }
          for f in austria.merged.zip austria.merged.osm.zip; do
            if [ -f "$f" ]; then tidy_one "$f"; fi
          done

      # Always upload as a workflow artifact (available for 7 days, useful for
      # debugging even when no release is cut).
      - name: Upload merged GTFS artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: austria.merged
          path: |
            austria.merged.zip
            austria.merged.osm.zip
            osm-extras/
          retention-days: 7

      - name: Timestamp
        id: stamp
        run: echo "utc=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      # Update (or create) a rolling "latest" release so there is always a
      # stable permalink:
      #   https://github.com/<owner>/<repo>/releases/download/latest/austria.merged.zip
      #
      # The release body includes the UTC timestamp from feed_info.txt so
      # anyone visiting the release page can see when it was last generated.
      # A stale OSM variant from an earlier run must not stay attached when this
      # run had no OSM data: remove it, so the asset is always current.
      - name: Remove stale OSM asset
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: |
          if [ ! -f austria.merged.osm.zip ]; then
            echo "::warning::No OSM variant this run; removing the old OSM assets from the release."
            for a in austria.merged.osm.zip osm-stop-attributes.csv.gz osm-qa-report.json; do
              gh release delete-asset latest "$a" --yes || true
            done
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish / update "latest" release
        if: steps.changes.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest GTFS Merge"
          body: |
            Automatically updated merged GTFS feed for Austria.

            **Last updated:** ${{ steps.stamp.outputs.utc }} · `${{ github.sha }}`

            ### Permalink
            ```
            https://github.com/${{ github.repository }}/releases/download/latest/austria.merged.zip
            ```

            ### Version checking
            The zip contains `feed_info.txt` with a `feed_version` field set to
            the UTC build timestamp (`YYYYMMDD_HHMMSS`).  Download only that
            entry to check whether you already have the latest version:

            ```bash
            # Check feed_version without downloading the full file
            curl -sL https://github.com/${{ github.repository }}/releases/download/latest/austria.merged.zip \
              | python3 -c "
            import sys, zipfile, io
            z = zipfile.ZipFile(io.BytesIO(sys.stdin.buffer.read()))
            print(z.read('feed_info.txt').decode())
            "
            ```

            ### Two files, two licences
            - `austria.merged.zip` (the permalink above) is built from the
              Mobilitätsverbünde Österreich data only. It contains no
              OpenStreetMap data.
            - `austria.merged.osm.zip` is the same feed enriched with
              OpenStreetMap data (© OpenStreetMap contributors,
              [ODbL](https://www.openstreetmap.org/copyright)): `wheelchair_boarding`
              and platform codes in `stops.txt`, extra station entrances in
              `stops.txt` (and `pathways.txt` while the tidy step keeps it), route
              colours and names in `routes.txt`. These files are offered under the
              ODbL; see the README for details.
            - `osm-stop-attributes.csv.gz` (tactile paving, bench, shelter, nearby
              bicycle parking and elevators per stop) and `osm-qa-report.json`
              (differences between the feed and OpenStreetMap) are OSM-derived
              as well (ODbL).

            `enrich-report.json` lists what the enrichment steps changed.

            Source manifests: see `versions.json` in this repository for the
            individual feed versions that were merged.
          files: |
            austria.merged.zip
            austria.merged.osm.zip
            osm-extras/osm-stop-attributes.csv.gz
            osm-extras/osm-qa-report.json
            enrich-report.json
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
